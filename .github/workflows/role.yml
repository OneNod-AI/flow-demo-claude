name: Team bot

# One run = one team bot doing one job: headless Claude Code in a fresh checkout.
# The router (flow.yml) dispatches this workflow instead of calling a chat bot's
# webhook; the dev lead dispatches it again for each executor. The run's log,
# result and cost stay here, and a one-line report goes to the task's Slack thread.

on:
  workflow_dispatch:
    inputs:
      bot:
        description: Which team bot
        type: choice
        options: [product, dev_lead, executor, reviewer, acceptance, outer_loop, process_improvement]
        required: true
      payload:
        description: Wake-up payload (JSON), as the router builds it
        default: "{}"
      model:
        description: Claude model; empty = repository variable FLOW_CLAUDE_MODEL, else claude-sonnet-5-5
        default: ""

permissions:
  contents: read
  actions: write          # the dev lead starts executor runs with the workflow token

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Pushes and PRs go out as the machine account. Its events start other
          # workflows (CI, the router); the workflow token's events would not.
          token: ${{ secrets.FLOW_BOT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install pyyaml pytest
          npm install -g @anthropic-ai/claude-code
          git config user.name "onenod-flow-bot"
          git config user.email "onenod-flow-bot@users.noreply.github.com"
      - name: Build the prompt
        env:
          BOT: ${{ inputs.bot }}
          PAYLOAD: ${{ inputs.payload }}
        run: python -m flow.role prompt --bot "$BOT" --payload "$PAYLOAD" > "$RUNNER_TEMP/prompt.txt"
      - name: Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
          FLOW_DISPATCH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BOARD_CHANNEL: ${{ vars.SLACK_BOARD_CHANNEL }}
          # Always name the model: without --model Claude Code defaults to Opus,
          # which a standard Team seat runs out of quickly. The router's own
          # dispatches send no model, so they use the repository variable.
          MODEL: ${{ inputs.model || vars.FLOW_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
        run: |
          echo "model: $MODEL" >> "$GITHUB_STEP_SUMMARY"
          set +e
          claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --model "$MODEL" \
            --output-format json \
            --max-turns 60 \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ls:*)" \
            > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/stderr.txt"
          code=$?
          # Keep going so Report runs; Report fails the job when the run failed.
          echo "claude exit code: $code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$RUNNER_TEMP/stderr.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Report
        if: always()
        env:
          BOT: ${{ inputs.bot }}
          PAYLOAD: ${{ inputs.payload }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BOARD_CHANNEL: ${{ vars.SLACK_BOARD_CHANNEL }}
        run: python -m flow.role report --bot "$BOT" --payload "$PAYLOAD" --result "$RUNNER_TEMP/result.json"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-result
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/stderr.txt
          if-no-files-found: ignore
