# Flow rules. GitHub Actions (flow/router.py) reads this file and nothing else
# to decide what happens next. No AI judgement here.
#
# Only people can change this file (protected path, PR + approval).
# Process-improvement proposals that change the flow edit this file.

version: 1

# Task statuses, in order. A task file lives at tasks/T-NNN.md.
statuses:
  - awaiting-confirmation   # task package PR is open, waiting for the confirmer
  - confirmed               # confirmer approved; dev lead is woken
  - in-progress             # dev lead has started execution sessions
  - awaiting-merge          # all checks passed, waiting for the merger
  - awaiting-acceptance     # code merged; acceptance bot is drafting
  - acceptance-proposed     # acceptance draft PR is open, waiting for the confirmer
  - closed                  # done (outcome: met / not-met / cancelled)
  - paused                  # stopped by an exception or the circuit breaker

# What happens on each event. "wake" dispatches the bot's job (.github/workflows/role.yml):
# Claude Code in GitHub Actions, reading bots/<bot>.md.
# The task_pr.* rows describe fixed behaviour in flow/router.py (who may merge
# what is a safety rule, so it is not configurable here); edit the others freely.
# "notify" posts in the task's Slack thread and mentions that role.
# "board" posts one line to the board channel.
# "hint" is appended to the notification: how to answer in Slack.
events:
  intake.opened:             # minutes or a document arrived (label source:minutes / source:doc)
    wake: product
    board: true
  candidate.opened:          # any other issue labelled "candidate" was opened
    notify: requirement_owner
    hint: "Reply in this thread `@Claude 接受`, `@Claude 暂缓` or `@Claude 不要: reason`."
    board: true
  candidate.accepted:        # requirement owner added the "accepted" label
    wake: product
    board: true
  candidate.human_reply:     # a person commented on a candidate labelled "clarifying"
    wake: product
  task_pr.opened:            # bot opened a PR that changes tasks/
    notify: confirmer
    board: true
  task_pr.approved:          # the task's confirmer approved that PR on GitHub
    merge: true
  task_pr.card_confirmed:    # team chief recorded an approval-card confirmation
    merge: true
  status.confirmed:
    wake: dev_lead
    set_status: in-progress
    board: true
  code_pr.opened:            # a task's code PR got a new commit: a fresh review job reads it
    wake: reviewer
  code_pr.checks_passed:      # CI green and the review job passed this commit (review_required)
    set_status: awaiting-merge
    notify: merger
    hint: "Reply in this thread `@Claude 合并 #{number}` (low-risk changes only), or merge on GitHub."
    board: true
  code_pr.checks_failed:
    wake: dev_lead            # until the failure limit below is reached
    record_problem: check-failure
  code_pr.changes_requested:
    wake: dev_lead
    record_problem: rework
  code_pr.merged:            # acceptance starts once no code PR for the task is still open
    set_status: awaiting-acceptance
    wake: acceptance
    board: true
  status.closed:
    write_summary: true
    notify: requester
    board: true
  status.paused:
    notify: confirmer
    board: true

# Limits and timers.
limits:
  failures_per_task: 3        # circuit breaker: pause the task after this many failed check runs
  reminders_per_status: 1     # remind once per status, then stay quiet
  reruns_per_commit: 1        # re-run failed GitHub Actions jobs once before waking the dev lead (0 = off)

timeouts_hours:               # remind the role on the right if a task sits in a status this long
                              # (awaiting-confirmation and acceptance-proposed are read from the open PR)
  awaiting-confirmation: { hours: 2, remind: confirmer }
  awaiting-merge:        { hours: 4, remind: merger }
  acceptance-proposed:   { hours: 4, remind: confirmer }
  awaiting-acceptance:   { hours: 2, remind: admin }      # the acceptance bot should have drafted by now
  in-progress:           { hours: 8, remind: confirmer }

# Scheduled jobs (times in UTC). The hourly Actions run checks these.
# only_if_new: skip the wake-up when there is nothing to look at (no untriaged
# feedback; no problem recorded in the last 7 days). A manual run always wakes.
schedules:
  outer_loop:          { every: day,  hour_utc: 1, wake: outer_loop, only_if_new: true }           # 09:00 Beijing / Singapore
  process_improvement: { every: week, weekday: monday, hour_utc: 2, wake: process_improvement, only_if_new: true }

# The reviewer job must post `/review passed` on the PR's latest commit before
# the merger is called. `/review changes-requested: …` wakes the dev lead.
review_required: true

# Merging code: people merge on GitHub, or say `@Claude 合并 #N` in the
# task's Slack thread and the router merges for them, if the risk allows.
merge_policy:
  slack_merge_allowed_risk: [low]   # risk levels that may be merged from Slack
  default_risk: medium              # when the task package sets no risk
  github_only_paths:                # a PR touching these is always high risk
    - rules/
    - bots/
    - flow/
    - .github/

# Only these paths may be merged by the router itself. Everything else is merged by people.
router_may_merge_paths:
  - tasks/
  - records/

# Which Claude model each team-bot job uses (flow/models.py). Executors start
# from the task's risk and move right after a failed check run or rework, never
# left. Running out of quota stops the job; it never moves to a weaker model.
models:
  ladder: [claude-sonnet-5-5, claude-opus-5-5]
  default: claude-sonnet-5-5    # every bot other than the executor
  executor_start_by_risk:
    low: claude-sonnet-5-5
    medium: claude-sonnet-5-5
    high: claude-opus-5-5

# Bots whose PRs are trusted to change task status (their GitHub login).
bot_logins:
  - onenod-flow-bot             # role jobs (Claude Code in Actions) write with this account
  - claude[bot]               # Claude Tag (the team chief) acts as the Claude GitHub App
